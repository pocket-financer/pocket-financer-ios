name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Format, build, and test
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      XCODEBUILD_JOBS: 2
      TEST_DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes

      - name: Validate project metadata, scripts, and contract assets
        run: |
          set -euo pipefail
          plutil -lint PocketFinancer.xcodeproj/project.pbxproj
          plutil -lint PocketFinancer/Resources/PrivacyInfo.xcprivacy
          xmllint --noout PocketFinancer.xcodeproj/xcshareddata/xcschemes/PocketFinancer.xcscheme
          jq empty .swift-format
          jq empty .github/rulesets/main.json
          jq empty release-please-config.json
          jq empty .release-please-manifest.json
          jq empty PocketFinancerTests/Fixtures/prefilter-vectors.json
          find PocketFinancer/Resources/SmsProcessing -name '*.json' -print0 | xargs -0 -n 1 jq empty
          sh -n scripts/format.sh scripts/build.sh scripts/test.sh

          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          root = pathlib.Path("PocketFinancer/Resources/SmsProcessing")
          manifest = json.loads((root / "release-manifest.json").read_text(encoding="utf-8"))
          artifacts = {item["path"]: item["sha256"] for item in manifest["artifacts"]}
          checked = 0
          for path in sorted(root.rglob("*")):
              if not path.is_file() or path.name == "release-manifest.json":
                  continue
              rel = path.relative_to(root).as_posix()
              expected = artifacts.get(rel)
              if expected is None:
                  sys.exit(f"Unlisted bundled SMS asset: {rel}")
              actual = hashlib.sha256(path.read_bytes().replace(b"\r\n", b"\n")).hexdigest()
              if actual != expected:
                  sys.exit(f"SHA-256 mismatch for {rel}: {actual} != {expected}")
              checked += 1
          if checked != 17:
              sys.exit(f"Expected 17 bundled iOS SMS assets, found {checked}")
          print(f"Verified {checked} bundled SMS contract assets against release-manifest.json.")
          PY

      - name: Validate release workflow dispatch and ruleset checks
        run: |
          set -euo pipefail
          workflow=.github/workflows/release.yml
          grep -Eq 'gh[[:space:]]+workflow[[:space:]]+run[[:space:]]+ci\.yml[[:space:]]+--repo[[:space:]]+"\$GITHUB_REPOSITORY"[[:space:]]+--ref[[:space:]]+"\$head_branch"' "$workflow"
          grep -Eq 'gh[[:space:]]+workflow[[:space:]]+run[[:space:]]+pr-title\.yml[[:space:]]+--repo[[:space:]]+"\$GITHUB_REPOSITORY"[[:space:]]+--ref[[:space:]]+"\$head_branch"' "$workflow"
          grep -Fq 'name: Format, build, and test' .github/workflows/ci.yml
          grep -Fq 'name: Conventional Commit title' .github/workflows/pr-title.yml

      - name: Enforce local-only runtime
        run: |
          if rg -q 'XCRemoteSwiftPackageReference|XCSwiftPackageProductDependency' PocketFinancer.xcodeproj/project.pbxproj; then
            echo "Unexpected remote Swift package dependency." >&2
            exit 1
          fi
          if rg -q '(^|[[:space:]])import[[:space:]]+(CloudKit|Network)([[:space:]]|$)|URLSession' PocketFinancer; then
            echo "Unexpected cloud or network API in the app target." >&2
            exit 1
          fi
          if git ls-files | rg -qi '(^|/)(sms\.db|all_sms\.json|extraction_ds\.jsonl|Signing\.local\.xcconfig|.*\.mobileprovision|.*\.p12|.*\.p8|.*\.cer|.*\.keystore|.*\.jks)$'; then
            echo "Unexpected raw-message corpus or signing material in the repository." >&2
            exit 1
          fi

      - name: Check formatting
        run: scripts/format.sh --lint

      - name: Build release configuration
        env:
          CONFIGURATION: Release
          DERIVED_DATA_PATH: ${{ runner.temp }}/PocketFinancerDerivedData
        run: scripts/build.sh

      - name: Run unit and UI smoke tests
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/PocketFinancerDerivedData
          ENABLE_CODE_COVERAGE: YES
          RESULT_BUNDLE_PATH: ${{ runner.temp }}/PocketFinancer.xcresult
        run: scripts/test.sh

      - name: Export coverage report
        if: always()
        run: |
          if [ -d "${{ runner.temp }}/PocketFinancer.xcresult" ]; then
            xcrun xccov view --report --json "${{ runner.temp }}/PocketFinancer.xcresult" > "${{ runner.temp }}/coverage.json"
          fi

      - name: Upload test result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pocket-financer-test-result
          path: |
            ${{ runner.temp }}/PocketFinancer.xcresult
            ${{ runner.temp }}/coverage.json
          if-no-files-found: warn
          retention-days: 14
